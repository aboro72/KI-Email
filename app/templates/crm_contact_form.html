<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontakt anlegen · CRM</title><link rel="stylesheet" href="/static/style.css"><script src="/ui-language.js" defer></script><script src="/static/i18n-catalog.js?v=20261002" defer></script><script src="/static/i18n.js?v=20261002" defer></script></head><body><header><a class="brand" href="/dashboard">AboroDesk</a>{% include '_grouped_nav.html' %}</header><main class="shell"><a href="/crm/contacts">← Zu den Kontakten</a><div class="intro"><div><span class="eyebrow">CRM · Personen</span><h1>Neuer Kontakt</h1><p>Verknüpfe den Kontakt direkt mit der richtigen Firma.</p></div></div><section class="panel">{% if companies %}<form method="post" action="/crm/contacts" class="account-form"><label>Firma<select name="company_id" required>{% for company in companies %}<option value="{{ company.id }}"{% if selected_company_id == company.id %} selected{% endif %}>{{ company.name }}</option>{% endfor %}</select></label><label>Name<input name="name" required autofocus></label><label>E-Mail<input name="email" type="email" required></label><label>Position<input name="role_title"></label><label>Telefon<input name="phone"></label><label>Quelle<input name="source_url" type="url"></label><button class="button">Kontakt speichern</button></form>{% else %}<div class="empty-state"><h2>Zuerst eine Firma anlegen</h2><a class="button" href="/crm/companies/new">Neue Firma</a></div>{% endif %}</section></main></body></html>
