<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Mail schreiben · AboroDesk Developer</title><link rel="stylesheet" href="/static/style.css"><style>.editor{min-height:320px;border:1px solid #cbd7e4;border-radius:8px;padding:1rem;background:#fff}.editor:focus{outline:3px solid #1976a933;border-color:#1976a9}.toolbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.65rem 0}.toolbar button,.toolbar select{border:1px solid #cbd7e4;background:#fff;border-radius:6px;padding:.42rem .55rem;cursor:pointer;color:#172033}.toolbar input[type=color]{height:32px;width:38px;padding:2px;border:1px solid #cbd7e4;border-radius:6px}.compose-actions{display:flex;gap:.7rem;align-items:center;margin-top:1rem}.format-label{font-size:.8rem;color:#607087;font-weight:600;margin:0}</style><script src="/ui-language.js" defer></script><script src="/static/i18n-catalog.js?v=20261002" defer></script><script src="/static/i18n.js?v=20261002" defer></script></head><body><header><a class="brand" href="/dashboard">AboroDesk</a>{% include '_grouped_nav.html' %}</header><main class="shell"><div class="intro"><div><span class="eyebrow">E-Mail</span><h1>{% if reply_to %}Antworten{% elif forward %}Weiterleiten{% else %}Neue E-Mail{% endif %}</h1><p>Text- oder HTML-E-Mail mit Formatierungen und Anhängen.</p></div></div><section class="panel"><form method="post" action="/compose" enctype="multipart/form-data" id="compose-form"><label>Absender<select name="account_id" required>{% for account in accounts %}<option value="{{ account.id }}">{{ account.email_address }}</option>{% endfor %}</select></label><label>An<input name="recipient" type="text" value="{{ recipient }}" placeholder="name@firma.de" required></label><label>CC<input name="cc" type="text" placeholder="Optional, mehrere mit Komma trennen"></label><label>BCC<input name="bcc" type="text" placeholder="Optional, mehrere mit Komma trennen"></label><label>Betreff<input name="subject" value="{{ subject }}"></label><label>Versandformat<select name="content_type" id="content-type"><option value="text">Nur Text</option><option value="html" selected>HTML / formatiert</option></select></label><div class="toolbar"><label class="format-label">Schrift<select onchange="format('fontName',this.value)"><option value="Arial">Arial</option><option value="Calibri">Calibri</option><option value="Georgia">Georgia</option><option value="Tahoma">Tahoma</option><option value="Times New Roman">Times New Roman</option><option value="Verdana">Verdana</option></select></label><label class="format-label">Größe<select onchange="format('fontSize',this.value)"><option value="2">Klein</option><option value="3" selected>Normal</option><option value="4">Groß</option><option value="5">Sehr groß</option><option value="6">Überschrift</option></select></label><button type="button" onclick="format('bold')"><strong>B</strong></button><button type="button" onclick="format('italic')"><em>I</em></button><button type="button" onclick="format('underline')"><u>U</u></button><button type="button" onclick="format('insertUnorderedList')">• Liste</button><button type="button" onclick="format('insertOrderedList')">1. Liste</button><button type="button" onclick="format('justifyLeft')">Links</button><button type="button" onclick="format('justifyCenter')">Mitte</button><button type="button" onclick="format('justifyRight')">Rechts</button><label class="format-label">Text <input type="color" value="#172033" onchange="format('foreColor',this.value)"></label><label class="format-label">Markierung <input type="color" value="#fff2a8" onchange="format('hiliteColor',this.value)"></label><button type="button" onclick="insertLink()">Link</button><button type="button" onclick="document.getElementById('image-input').click()">Bild einfügen</button></div><div id="editor" class="editor" contenteditable="true">{{ body }}</div><input type="hidden" name="body" id="body"><input type="hidden" name="html_body" id="html-body"><input type="file" id="image-input" accept="image/*" hidden onchange="insertImage(this)"><input type="hidden" name="in_reply_to" value="{{ source.message_id if source and reply_to else '' }}"><label>Anhänge<input name="attachments" type="file" multiple><small class="muted">Maximal 10 MB pro Datei. Bilder im Editor werden in die HTML-Mail eingebettet.</small></label><div class="compose-actions"><button class="button" type="submit" onclick="return prepareEmail()">Senden</button><a class="button secondary" href="/inbox">Abbrechen</a></div></form></section></main><script>function format(command,value=null){document.getElementById('editor').focus();document.execCommand(command,false,value)}function insertLink(){const url=prompt('URL eingeben:');if(url){format('createLink',url)}}function insertImage(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{document.getElementById('editor').focus();document.execCommand('insertImage',false,reader.result)};reader.readAsDataURL(file);input.value=''}function prepareEmail(){const editor=document.getElementById('editor'),plain=document.getElementById('body'),html=document.getElementById('html-body'),mode=document.getElementById('content-type').value;plain.value=editor.innerText.trim();html.value=mode==='html'?editor.innerHTML:'';return plain.value.length>0}</script></body></html>
