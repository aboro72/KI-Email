<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ message.subject }} · KI-Email</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="brand" href="/">KI-Email</a><nav><a href="/inbox">Posteingang</a><form method="post" action="/logout"><button class="link-button">Abmelden</button></form></nav></header><main class="shell"><a href="/inbox">← Zurück zum Posteingang</a><section class="panel message"><h1>{{ message.subject }}</h1><p class="muted">Von: {{ message.sender }} · {{ message.date }}</p><pre>{{ message.body }}</pre><form method="post" action="/inbox/{{ message.id }}/trash"><button class="button secondary" type="submit">In Papierkorb verschieben</button></form></section></main></body></html>
