<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket anlegen · Helpdesk</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="brand" href="/dashboard">AboroDesk</a>{% include '_grouped_nav.html' %}</header><main class="shell"><a href="/helpdesk">← Zum Helpdesk</a><div class="intro"><div><span class="eyebrow">Support</span><h1>Neues Ticket</h1><p>Erfasse Kunden- und Problemdaten gemeinsam, damit Agenten sofort den nötigen Kontext haben.</p></div></div><section class="panel"><form method="post" action="/helpdesk/tickets" class="account-form"><label>Betreff<input name="subject" required autofocus></label><label>Kundennummer<input name="customer_number"></label><label>Name<input name="requester_name" required></label><label>Firma<input name="requester_company"></label><label>E-Mail<input name="requester_email" type="email" required></label><label>Telefon<input name="requester_phone" type="tel"></label><label>Adresse<textarea name="requester_address" rows="3"></textarea></label><label>Produkt<select name="product"><option value="">Allgemein</option><option>ABoroOffice</option><option>LMS</option><option>LMS3-ML</option><option>ABoro-IT</option></select></label><label>Kategorie<select name="category_id"><option value="">Nicht zugeordnet</option>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label><label>Priorität<select name="priority"><option value="normal">Normal</option><option value="niedrig">Niedrig</option><option value="hoch">Hoch</option><option value="kritisch">Kritisch</option></select></label><label>Beschreibung<textarea name="description" rows="8" required></textarea></label><button class="button">Ticket anlegen</button></form></section></main></body></html>
