<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead anlegen · CRM</title><link rel="stylesheet" href="/static/style.css"><script src="/ui-language.js" defer></script><script src="/static/i18n-catalog.js?v=20261002" defer></script><script src="/static/i18n.js?v=20261002" defer></script></head><body><header><a class="brand" href="/dashboard">AboroDesk</a>{% include '_grouped_nav.html' %}</header><main class="shell"><a href="/crm/leads">← Zu den Leads</a><div class="intro"><div><span class="eyebrow">CRM · Pipeline</span><h1>Neuer Lead</h1><p>Lege Zuständigkeit und nächste Aktion direkt fest.</p></div></div><section class="panel">{% if companies %}<form method="post" action="/crm/leads" class="account-form"><label>Firma<select name="company_id" required>{% for company in companies %}<option value="{{ company.id }}"{% if selected_company_id == company.id %} selected{% endif %}>{{ company.name }}</option>{% endfor %}</select></label><label>Kontakt<select name="contact_id"><option value="">Kein Kontakt ausgewählt</option>{% for contact in contacts %}<option value="{{ contact.id }}">{{ contact.name }} · {{ contact.company.name }}</option>{% endfor %}</select></label><label>Zuständig<select name="owner_user_id"><option value="">Nicht zugeordnet</option>{% for item in users %}<option value="{{ item.id }}">{{ item.display_name }}</option>{% endfor %}</select></label><label>Status<select name="status"><option value="neu">Neu</option><option value="in_bearbeitung">In Bearbeitung</option><option value="qualifiziert">Qualifiziert</option><option value="gewonnen">Gewonnen</option><option value="verloren">Verloren</option></select></label><label>Score 0–100<input name="score" type="number" min="0" max="100" value="0"></label><label>Nächste Aktion<input name="next_action" placeholder="Erstkontakt vorbereiten"></label><label>Individueller Verkaufstext<textarea name="sales_pitch" rows="8" placeholder="Entwurf für diesen Lead"></textarea></label><label>Notizen<textarea name="notes" rows="4"></textarea></label><button class="button">Lead speichern</button></form>{% else %}<div class="empty-state"><h2>Zuerst eine Firma anlegen</h2><a class="button" href="/crm/companies/new">Neue Firma</a></div>{% endif %}</section></main></body></html>
