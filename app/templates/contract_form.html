<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% if contract %}Vertrag bearbeiten{% else %}Vertrag anlegen{% endif %} · AboroDesk</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/contracts.css"></head><body>
<header><a class="brand" href="/dashboard">AboroDesk</a>{% include '_grouped_nav.html' %}</header><main class="shell"><div class="intro"><div><span class="eyebrow">Vertragsverwaltung</span><h1>{% if contract %}Vertrag bearbeiten{% else %}Neuer Vertrag{% endif %}</h1></div><a href="{% if contract %}/contracts/{{ contract.id }}{% else %}/contracts{% endif %}">Zurück</a></div>
<form class="panel contract-form" method="post" action="{% if contract %}/contracts/{{ contract.id }}{% else %}/contracts{% endif %}">{% if contract %}<input type="hidden" name="revision" value="{{ contract.revision }}">{% endif %}
<label>Titel<input name="title" maxlength="240" required value="{{ contract.title if contract else '' }}"></label><label>Vertragsnummer<input name="contract_number" maxlength="100" value="{{ contract.contract_number if contract else '' }}"></label>
<label>CRM-Firma<select name="company_id"><option value="0">Keine Zuordnung</option>{% for company in companies %}<option value="{{ company.id }}" {% if contract and contract.company_id == company.id %}selected{% endif %}>{{ company.name }}</option>{% endfor %}</select></label><label>Vertragspartner<input name="counterparty" maxlength="240" value="{{ contract.counterparty if contract else '' }}"></label>
<label>Vertragsart<select name="contract_type">{% for value,label in types.items() %}<option value="{{ value }}" {% if contract and contract.contract_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Status<select name="status">{% for value,label in statuses.items() %}<option value="{{ value }}" {% if contract and contract.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Verantwortlich<select name="owner_user_id" required>{% for person in users %}<option value="{{ person.id }}" {% if (contract and contract.owner_user_id == person.id) or (not contract and person.id == user.id) %}selected{% endif %}>{{ person.display_name }}</option>{% endfor %}</select></label><span></span>
<label>Beginn<input type="date" name="start_date" value="{{ contract.start_date if contract else '' }}"></label><label>Ende<input type="date" name="end_date" value="{{ contract.end_date if contract else '' }}"></label><label>Kündigungsfrist in Tagen<input type="number" name="notice_period_days" min="0" max="3650" value="{{ contract.notice_period_days if contract else 0 }}"></label><label>Verlängerung in Monaten<input type="number" name="renewal_months" min="0" max="120" value="{{ contract.renewal_months if contract else 0 }}"></label>
<label class="check-row full"><input type="checkbox" name="auto_renew" value="1" {% if contract and contract.auto_renew %}checked{% endif %}> Automatische Verlängerung laut Vertrag</label>
<label class="full">Beschreibung<textarea name="description" rows="5">{{ contract.description if contract else '' }}</textarea></label><label class="full">Text für KI-Prüfung<textarea name="analysis_text" rows="12" placeholder="Optional: Vertragstext einfügen. Bei DOCX/TXT wird der Text beim Upload automatisch übernommen.">{{ contract.analysis_text if contract else '' }}</textarea></label>
<p class="muted full">Die KI-Prüfung ist eine Arbeitshilfe und keine Rechtsberatung. Ergebnisse müssen immer von einer Person geprüft werden.</p><button class="button full" type="submit">{% if contract %}Änderungen speichern{% else %}Vertrag anlegen{% endif %}</button></form>
</main></body></html>
